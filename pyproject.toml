[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "flybet"
version = "0.1.0"
description = "A fake-money slot experiment driven by the full retained MaleCNS v1.0 connectome"
requires-python = ">=3.11"
license-files = ["licenses/*.txt"]
dependencies = ["numpy>=2.2,<3", "pandas>=2.2,<4", "pyarrow>=19,<26", "Pillow>=11,<13", "fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[project.scripts]
flybet = "flybet.cli:main"

[tool.setuptools.packages.find]
include = ["flybet*"]

[tool.setuptools.package-data]
flybet = ["*.json", "native/*.cpp", "native/*.so", "native/*.dylib", "web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
